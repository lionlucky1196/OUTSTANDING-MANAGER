<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>New Vyanktesh Agro – Outstanding Manager</title>
<style>
:root{--g:#14532d;--bt:#fff;--bg:#f3f7f4;--c:#fff;--t:#14211a;--m:#5b6b61;--b:#dce6df;--r:#b91c1c;--a:#b45309;--s:#0f3d22;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--g:#4ade80;--bt:#052e16;--bg:#0c1410;--c:#15211a;--t:#e6efe9;--m:#93a79a;--b:#26382c;--r:#f87171;--a:#fbbf24;--s:#0a1f13}}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
nav{position:fixed;z-index:5;background:var(--s);display:flex}nav b{display:none}nav a{color:#cfe6d6;padding:12px 6px;flex:1;text-align:center;font-size:12px;cursor:pointer}nav a.on{color:#fff;background:#ffffff1f}
@media(max-width:767px){nav{left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}main{padding-bottom:80px!important}}
@media(min-width:768px){nav{top:0;bottom:0;left:0;width:210px;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}nav b{display:block;color:#fff;padding:20px 16px;font-size:16px;line-height:1.25}nav a{text-align:left;font-size:15px;padding:14px 16px}main{margin-left:210px!important}}
main{flex:1;padding:18px;max-width:1200px;width:100%;min-width:0}h1{font-size:22px;margin:0 0 12px;color:var(--g)}h3{margin:0 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}.k{font-size:12px;color:var(--m)}.v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}th,td{padding:9px 8px;border-bottom:1px solid var(--b);text-align:left}th{color:var(--m);font-weight:600;font-size:12px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.cl{cursor:pointer}
input,select,textarea,button{font:inherit;padding:10px 12px;border:1px solid var(--b);border-radius:9px;background:var(--c);color:var(--t);min-height:42px}
button{background:var(--g);color:var(--bt);border:0;font-weight:600;cursor:pointer}button.s{background:none;color:var(--g);border:1px solid var(--g)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.row>*{flex:1;min-width:130px}.row>button{flex:0 0 auto}
.p{padding:2px 8px;border-radius:99px;font-size:11.5px;background:#16a34a22;color:var(--g)}.p.o{background:#b4530922;color:var(--a)}.p.r{background:#b91c1c22;color:var(--r)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}.bar i{display:block;height:14px;border-radius:4px;background:var(--g);min-width:2px}.bar span:first-child{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo{background:#b4530922;color:var(--a);padding:8px 12px;border-radius:9px;margin-bottom:12px;font-size:13px}.err{color:var(--r);margin:6px 0}
@media print{nav,.np{display:none!important}main{margin:0!important}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main><div id="st" class="np" style="position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:9;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--c);border:1px solid var(--b);color:var(--m)">Loading…</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>(n<0?'-':'')+'₹'+Math.abs(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
const D=s=>s?s.split('-').reverse().join('-'):'—';
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
const days=d=>Math.round((new Date(today())-new Date(d))/864e5);
const ago=n=>{const d=new Date(today());d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const LBL={opening:'Opening balance',credit:'Credit purchase',cash:'Cash purchase',upi:'UPI purchase',payment:'Payment received',return:'Sales return',adjust:'Credit adjustment',reversal:'Reversal'};
let S={c:[],t:[],f:{},log:[],n:{c:0,t:0},demo:false},db=null,ref=null,last='',view='dash',cur=null,q='',vf='',sort='out',rp='all',rf='',rt='',msg='',rcpt=null;
const nav=[['dash','Dashboard'],['cust','Customers'],['reg','Register'],['pay','Collect'],['fup','Follow-ups'],['rep','Reports']];

function addC(o){S.n.c++;const c={id:'C'+String(S.n.c).padStart(4,'0'),reg:today(),taluka:'Dharangaon',district:'Jalgaon',cat:'Small farmer',notes:'',address:'',...o};S.c.push(c);if(+o.open)addT(c.id,'opening',o.regd||c.reg,o.open,{desc:'Opening balance'});return c}
function addT(cid,type,date,amt,o={}){S.n.t++;const id='T'+String(S.n.t).padStart(6,'0');S.t.push({id,cid,type,date,amt:+amt,time:new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata'}),inv:'',mode:'',desc:'',ref:'',notes:'',...o});log(`${id} ${LBL[type]} ${inr(amt)} for ${cid}`);return id}
function log(m){S.log.unshift({ts:today()+' '+new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata'}),m});S.log=S.log.slice(0,200)}
function calc(c){const T=S.t.filter(t=>t.cid==c.id&&!t.rev&&t.type!='reversal').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id<b.id?-1:1);let deb=[],cr=0,pay=0,ret=0,open=0,cred=0,lp=null;
 T.forEach(t=>{if(t.type=='opening'){open+=t.amt;deb.push({d:t.date,a:t.amt})}else if(t.type=='credit'){cred+=t.amt;deb.push({d:t.date,a:t.amt,inv:t.inv})}else if(t.type=='payment'){pay+=t.amt;cr+=t.amt;lp=t}else if(t.type=='return'||t.type=='adjust'){ret+=t.amt;cr+=t.amt}});
 let rem=cr;deb.forEach(x=>{const u=Math.min(x.a,rem);x.a-=u;rem-=u});const un=deb.filter(x=>x.a>0),bal=open+cred-cr,old=un.length?Math.max(...un.map(x=>days(x.d))):0;
 const st=bal<0?'Advance':bal==0?'Clear':old>90?'Overdue 90+':old>30?'Overdue':'Current';
 return{c,open,cred,pay,ret,bal,lp,old,un,st,over:bal>0&&old>30,dl:lp?days(lp.date):null}}
const all=()=>S.c.map(calc),effect=t=>t.rev||t.type=='reversal'?0:['opening','credit'].includes(t.type)?t.amt:['payment','return','adjust'].includes(t.type)?-t.amt:0;
const pill=s=>`<span class="p ${/90/.test(s)?'r':/Overdue/.test(s)?'o':''}">${s}</span>`;
const bars=(a,f=inr)=>{const m=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class="bar"><span>${esc(x[0])}</span><i style="width:${Math.max(1,x[1]/m*55)}%"></i><span>${f(x[1])}</span></div>`).join('')||'<div class="k">No data</div>'};

let ready=false;
const E=()=>({c:[],t:[],f:{},log:[],n:{c:0,t:0},demo:false}),tm=()=>new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata'});
function setSt(t){const e=$('#st');if(e)e.textContent=t}
function persist(){if(!ready)return;S.ts=Date.now();const j=JSON.stringify(S);last=j;try{const o=localStorage.getItem('nva');if(o)localStorage.setItem('nva_prev',o);localStorage.setItem('nva',j)}catch(e){}
 if(ref){setSt('Saving…');ref.set(JSON.parse(j)).then(()=>setSt('Saved ✓ '+tm())).catch(()=>{setSt('⚠ Not synced – kept on this device, retrying');setTimeout(persist,5000)})}else setSt('Saved on this device only')}
async function dailyBackup(){try{const b=db.doc('backups/'+today()),x=await b.get();if(!x.exists&&S.c.length)await b.set(JSON.parse(JSON.stringify(S)))}catch(e){}}
function applyRestore(d){if(!d||!d.c||!d.t)return setSt('⚠ Not a valid backup');if(db)db.doc('backups/before-restore-'+Date.now()).set(JSON.parse(JSON.stringify(S))).catch(()=>{});S=d;log('Data restored from backup');persist();render()}
function restoreFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{applyRestore(JSON.parse(r.result))}catch(e){setSt('⚠ Not a valid backup')}};r.readAsText(f)}
async function restoreDate(){const v=$('#rd').value;if(!v||!db)return setSt('Pick a date');try{const x=await db.doc('backups/'+v).get();x.exists?applyRestore(x.data()):setSt('No backup for '+D(v))}catch(e){setSt('⚠ Could not read backup')}}
function go(v,c){view=v;cur=c||null;rcpt=null;msg='';render()}
function render(){if(!ready){$('#app').innerHTML='<div class="card">Loading your saved data…</div>';return}$('#nav').innerHTML='<b>New Vyanktesh Agro<br><small style="font-weight:400">Outstanding Manager</small></b>'+nav.map(n=>`<a class="${view==n[0]||(view=='led'&&n[0]=='cust')?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');
 $('#app').innerHTML=(view=='dash'?'':remBanner())+V[view]()}
const sync=(id,fn)=>{window[id]=fn};

const V={
dash(){const A=all(),mo=today().slice(0,7),P=S.t.filter(t=>t.type=='payment'&&!t.rev),tot=A.reduce((s,x)=>s+Math.max(0,x.bal),0),
 cm=P.filter(t=>t.date.startsWith(mo)).reduce((s,t)=>s+t.amt,0),ct=P.filter(t=>t.date==today()).reduce((s,t)=>s+t.amt,0),cs=S.t.filter(t=>t.type=='credit'&&!t.rev&&t.date.startsWith(mo)).reduce((s,t)=>s+t.amt,0);
 const bk=[['0–30',0,30],['31–60',31,60],['61–90',61,90],['91–180',91,180],['180+',181,1e9]].map(b=>[b[0],A.reduce((s,x)=>s+x.un.filter(u=>{const d=days(u.d);return d>=b[1]&&d<=b[2]}).reduce((q,u)=>q+u.a,0),0)]);
 const M=[...Array(6)].map((_,i)=>{const d=new Date(today());d.setDate(1);d.setMonth(d.getMonth()-5+i);const k=d.toISOString().slice(0,7),e=new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);return{k,e}});
 const fu=Object.entries(S.f).filter(([i,f])=>f.next==today()).map(([i,f])=>[S.c.find(c=>c.id==i),f]).filter(x=>x[0]);
 return`<h1>Dashboard</h1>${remCard()}<div class="grid">${[['Total outstanding',inr(tot)],['Collected this month',inr(cm)],['Outstanding customers',A.filter(x=>x.bal>0).length],['Overdue customers',A.filter(x=>x.over).length],['Today’s collections',inr(ct)],['Credit sales this month',inr(cs)],['Total customers',S.c.length],['Collection progress',(cm+tot?Math.round(cm/(cm+tot)*100):0)+'%']].map(k=>`<div class="card" style="margin:0"><div class="k">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('')}</div>
 <div class="grid g2"><div class="card"><h3>Age-wise outstanding</h3>${bars(bk)}</div><div class="card"><h3>Top 10 outstanding</h3>${bars(A.filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal).slice(0,10).map(x=>[x.c.name,x.bal]))}</div>
 <div class="card"><h3>Monthly outstanding (month end)</h3>${bars(M.map(m=>[m.k,S.t.filter(t=>t.date<=m.e).reduce((s,t)=>s+effect(t),0)]))}</div><div class="card"><h3>Monthly collections</h3>${bars(M.map(m=>[m.k,P.filter(t=>t.date.startsWith(m.k)).reduce((s,t)=>s+t.amt,0)]))}</div></div>
 <div class="card"><h3>Today’s follow-ups</h3>${fu.map(([c,f])=>`<div>${esc(c.name)} – ${esc(f.status||'Not contacted')} ${f.promAmt?'· promised '+inr(f.promAmt):''}</div>`).join('')||'<div class="k">None scheduled for today</div>'}</div>`},

cust(){let A=all().filter(x=>(!q||(x.c.name+x.c.mobile).toLowerCase().includes(q.toLowerCase()))&&(!vf||x.c.village==vf));const vs=[...new Set(S.c.map(c=>c.village))].sort();
 return`<h1>Customers</h1><div class="card np"><div class="row"><input id="q" placeholder="Search name or mobile" value="${esc(q)}" oninput="q=this.value;render();$('#q').focus()"><select onchange="vf=this.value;render()"><option value="">All villages</option>${vs.map(v=>`<option ${v==vf?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
 <h3>Add customer</h3><div class="row"><input id="n" placeholder="Full name"><input id="m" inputmode="numeric" placeholder="Mobile (10 digits)"><input id="v" placeholder="Village"><input id="tk" placeholder="Taluka" value="Dharangaon"><input id="o" type="number" min="0" placeholder="Opening outstanding ₹"><input id="du" type="date" title="Payment due date"><button onclick="saveC()">Add</button></div><div class="err">${msg}</div>
 <details><summary class="k">Bulk import (CSV: name,mobile,village,opening)</summary><textarea id="imp" rows="3" style="width:100%"></textarea><button class="s" onclick="imp()">Import</button></details></div>
 <div class="card sc"><table><tr><th>ID</th><th>Name</th><th>Village</th><th>Mobile</th><th>Due</th><th class="n">Outstanding</th></tr>${A.map(x=>`<tr class="cl" onclick="go('led','${x.c.id}')"><td>${x.c.id}</td><td>${esc(x.c.name)}</td><td>${esc(x.c.village)}</td><td>${esc(x.c.mobile)}</td><td>${D(x.c.due)}</td><td class="n">${inr(x.bal)}</td></tr>`).join('')}</table></div>`},

reg(){const srt={out:(a,b)=>b.bal-a.bal,low:(a,b)=>a.bal-b.bal,old:(a,b)=>b.old-a.old,rec:(a,b)=>(b.lp?.date||'')<(a.lp?.date||'')?-1:1,vil:(a,b)=>a.c.village.localeCompare(b.c.village),over:(a,b)=>b.over-a.over||b.old-a.old};
 return`<h1>Outstanding Register</h1><div class="row np"><select onchange="sort=this.value;render()">${[['out','Highest outstanding'],['low','Lowest outstanding'],['old','Oldest outstanding'],['rec','Recent payment'],['vil','Village'],['over','Overdue status']].map(o=>`<option value="${o[0]}" ${sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><button class="s" onclick="window.print()">Print register</button><button class="s" onclick="csv('register')">Export CSV</button></div>
 <div class="card sc">${regT(all().sort(srt[sort]))}</div>`},

led(){const x=calc(S.c.find(c=>c.id==cur)),c=x.c,T=S.t.filter(t=>t.cid==c.id).sort((a,b)=>a.id<b.id?1:-1);
 return`<h1>${esc(c.name)} <small class="k">${c.id}</small></h1><div class="grid"><div class="card" style="margin:0"><div class="k">Current outstanding</div><div class="v">${inr(x.bal)}</div>${pill(x.st)}</div><div class="card" style="margin:0"><div class="k">${esc(c.village)}, ${esc(c.taluka)}, ${esc(c.district)}</div><div>${esc(c.mobile)}</div><div class="k">Registered ${D(c.reg)}</div><div class="k" style="margin-top:6px">Payment due date</div><input type="date" value="${c.due||''}" onchange="setDue('${c.id}',this.value)"></div></div>
 <div class="card np"><h3>Add transaction</h3><div class="row"><select id="tt"><option value="cash">Cash purchase</option><option value="upi">UPI purchase</option><option value="credit">Credit purchase</option><option value="return">Sales return</option><option value="adjust">Credit adjustment</option><option value="opening">Opening balance</option></select><input id="ta" type="number" min="0" step="0.01" placeholder="Amount ₹"><input id="td" type="date" value="${today()}"><input id="ti" placeholder="Invoice no."><input id="tn" placeholder="Description / notes"><button onclick="saveT()">Save</button></div><div class="err">${msg}</div>
 <button class="s" onclick="go('pay','${c.id}')">Collect payment</button> <button class="s" onclick="window.print()">Print ledger</button> <button class="s" onclick="csv('ledger','${c.id}')">Download statement</button></div>
 <div class="card sc"><table><tr><th>ID</th><th>Date / time</th><th>Type</th><th>Invoice</th><th>Mode</th><th>Description</th><th class="n">Amount</th><th></th></tr>${T.map(t=>`<tr style="${t.rev?'opacity:.5;text-decoration:line-through':''}"><td>${t.id}</td><td>${D(t.date)} ${t.time||''}</td><td>${LBL[t.type]}</td><td>${esc(t.inv)}</td><td>${esc(t.mode)}</td><td>${esc(t.desc||t.notes)}</td><td class="n">${inr(t.amt)}</td><td class="np">${t.rev||t.type=='reversal'?(t.rev?'Reversed by '+t.rev:''):`<a onclick="rev('${t.id}')" style="color:var(--r);cursor:pointer">Reverse</a>`}</td></tr>`).join('')}</table></div>`},

pay(){const x=cur?calc(S.c.find(c=>c.id==cur)):null,H=x?S.t.filter(t=>t.cid==cur&&t.type=='payment').slice(-5).reverse():[];
 return`<h1>Payment Collection</h1>${rcpt?`<div class="card" id="rc"><h3>Payment receipt – ${rcpt.id}</h3><div>New Vyanktesh Agro Agency, Dharangaon</div><div>Date: ${D(rcpt.date)} ${rcpt.time}</div><div>Received from: <b>${esc(rcpt.n)}</b> (${rcpt.cid})</div><div class="v">${inr(rcpt.amt)}</div><div>Mode: ${rcpt.mode} ${esc(rcpt.ref)}</div><div>Balance after payment: ${inr(rcpt.bal)}</div><div class="np"><button onclick="window.print()">Print receipt</button> <button class="s" onclick="rcpt=null;render()">New payment</button></div></div>`:`
 <div class="card"><div class="row"><select onchange="cur=this.value||null;msg='';render()"><option value="">Select customer</option>${S.c.map(c=>`<option value="${c.id}" ${c.id==cur?'selected':''}>${esc(c.name)} – ${esc(c.village)}</option>`).join('')}</select></div>
 ${x?`<div class="k">Current outstanding</div><div class="v">${inr(x.bal)}</div><div class="row" style="margin-top:10px"><input id="pa" type="number" min="0" step="0.01" placeholder="Amount received ₹"><select id="pm"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Other</option></select><input id="pr" placeholder="Reference no."><input id="pn" placeholder="Collection notes"></div><label class="k"><input type="checkbox" id="adv" style="min-height:0"> Record any excess as advance</label><div class="err">${msg}</div><button onclick="savePay()">Record payment</button>`:''}</div>
 ${H.length?`<div class="card"><h3>Previous payments</h3>${H.map(t=>`<div>${D(t.date)} · ${inr(t.amt)} · ${t.mode} ${t.rev?'(reversed)':''}</div>`).join('')}</div>`:''}`}`},

fup(){const A=all().filter(x=>x.bal>0).sort((a,b)=>b.old-a.old),ST=['Not contacted','Contacted','Payment promised','Partially paid','Fully paid','Disputed'];
 return`<h1>Collection Follow-ups</h1>${A.map(x=>{const f=S.f[x.c.id]||{},u=`https://wa.me/91${x.c.mobile.replace(/\D/g,'').slice(-10)}?text=${encodeURIComponent(`Namaste ${x.c.name}, this is a gentle reminder from New Vyanktesh Agro Agency, Dharangaon. Your outstanding balance is ${inr(x.bal)}. Kindly arrange the payment at your convenience. Thank you.`)}`;
 return`<div class="card"><b>${esc(x.c.name)}</b> · ${inr(x.bal)} · ${pill(x.st)}<div class="row" style="margin-top:8px"><select onchange="fu('${x.c.id}','status',this.value)">${ST.map(s=>`<option ${(f.status||ST[0])==s?'selected':''}>${s}</option>`).join('')}</select><input type="date" title="Next follow-up" value="${f.next||''}" onchange="fu('${x.c.id}','next',this.value)"><input type="date" title="Promised date" value="${f.promDate||''}" onchange="fu('${x.c.id}','promDate',this.value)"><input type="number" placeholder="Promised ₹" value="${f.promAmt||''}" onchange="fu('${x.c.id}','promAmt',this.value)"><input placeholder="Remarks" value="${esc(f.remarks)}" onchange="fu('${x.c.id}','remarks',this.value)"><a href="${u}" target="_blank" rel="noopener"><button>WhatsApp</button></a></div><div class="k">Last contact: ${D(f.last)}</div></div>`}).join('')||'<div class="card">No outstanding customers.</div>'}`},

rep(){const A=all(),R={all:['All outstanding',A.filter(x=>x.bal>0)],vil:['Village-wise',null],g10:['Above ₹10,000',A.filter(x=>x.bal>10000)],g25:['Above ₹25,000',A.filter(x=>x.bal>25000)],g50:['Above ₹50,000',A.filter(x=>x.bal>50000)],n30:['No payment 30+ days',A.filter(x=>x.bal>0&&(x.dl??999)>=30)],n60:['No payment 60+ days',A.filter(x=>x.bal>0&&(x.dl??999)>=60)],n90:['No payment 90+ days',A.filter(x=>x.bal>0&&(x.dl??999)>=90)],n180:['No payment 180+ days',A.filter(x=>x.bal>0&&(x.dl??999)>=180)],pay:['Payments received',null]};
 let body='';if(rp=='vil'){const m={};A.filter(x=>x.bal>0).forEach(x=>m[x.c.village]=(m[x.c.village]||0)+x.bal);body=bars(Object.entries(m).sort((a,b)=>b[1]-a[1]))}
 else if(rp=='pay'){const P=S.t.filter(t=>t.type=='payment'&&!t.rev&&(!rf||t.date>=rf)&&(!rt||t.date<=rt));body=`<table><tr><th>Date</th><th>Customer</th><th>Mode</th><th class="n">Amount</th></tr>${P.map(t=>`<tr><td>${D(t.date)}</td><td>${esc(S.c.find(c=>c.id==t.cid)?.name)}</td><td>${t.mode}</td><td class="n">${inr(t.amt)}</td></tr>`).join('')}</table><b>Total ${inr(P.reduce((s,t)=>s+t.amt,0))}</b>`}
 else body=regT(R[rp][1]);
 return`<h1>Reports</h1><div class="card np"><div class="row"><select onchange="rp=this.value;render()">${Object.entries(R).map(([k,v])=>`<option value="${k}" ${rp==k?'selected':''}>${v[0]}</option>`).join('')}</select><input type="date" value="${rf}" onchange="rf=this.value;render()"><input type="date" value="${rt}" onchange="rt=this.value;render()"></div><button class="s" onclick="csv('rep')">Export CSV (opens in Excel)</button> <button class="s" onclick="window.print()">Print / Save PDF</button> <button class="s" onclick="backup()">Backup data</button><div class="row" style="margin-top:10px"><input type="file" accept=".json" onchange="restoreFile(this)"><input id="rd" type="date"><button class="s" onclick="restoreDate()">Restore auto-backup</button></div><div class="k">Restoring replaces current data. A daily backup is kept automatically in the cloud.</div></div><div class="card sc">${body}</div>
 <div class="card"><h3>Audit log</h3>${S.log.slice(0,15).map(l=>`<div class="k">${l.ts} · ${esc(l.m)}</div>`).join('')}</div>`}};

function dueList(){return all().filter(x=>x.bal>0&&x.c.due).map(x=>({x,d:days(x.c.due)})).filter(o=>o.d>=-7).sort((a,b)=>b.d-a.d)}
function remBanner(){const n=dueList().filter(o=>o.d>=0).length;return n?`<div class="demo np" onclick="go('dash')" style="cursor:pointer">⏰ ${n} customer payment${n>1?'s':''} due today or overdue – tap to view</div>`:''}
function remCard(){const L=dueList();return`<div class="card"><h3>⏰ Payment due reminders</h3>${L.map(({x,d})=>{const u=`https://wa.me/91${x.c.mobile.replace(/\D/g,'').slice(-10)}?text=${encodeURIComponent(`Namaste ${x.c.name}, this is a gentle reminder from New Vyanktesh Agro Agency, Dharangaon. Your payment of ${inr(x.bal)} is due on ${D(x.c.due)}. Kindly arrange the payment at your convenience. Thank you.`)}`;return`<div class="row" style="align-items:center"><div><b>${esc(x.c.name)}</b> · ${inr(x.bal)}<div class="k">Due ${D(x.c.due)} · ${esc(x.c.village)}</div></div><span><span class="p ${d>0?'r':d==0?'o':''}">${d>0?d+' days overdue':d==0?'Due today':'Due in '+(-d)+' days'}</span></span><div style="flex:0 0 auto" class="np"><a href="${u}" target="_blank" rel="noopener"><button>WhatsApp</button></a> <button class="s" onclick="go('led','${x.c.id}')">Open</button></div></div>`}).join('')||'<div class="k">Nothing due in the next 7 days. Set a payment due date on a customer to get reminders.</div>'}</div>`}
function setDue(id,v){const c=S.c.find(c=>c.id==id);c.due=v;log(`Due date for ${id} set to ${D(v)}`);persist();render()}
function regT(A){return`<table><tr><th>ID</th><th>Customer</th><th>Village</th><th>Mobile</th><th class="n">Previous</th><th class="n">Credit</th><th class="n">Paid</th><th class="n">Returns/adj.</th><th class="n">Outstanding</th><th>Last pay</th><th class="n">Days</th><th>Status</th></tr>${A.map(x=>`<tr class="cl" onclick="go('led','${x.c.id}')"><td>${x.c.id}</td><td>${esc(x.c.name)}</td><td>${esc(x.c.village)}</td><td>${esc(x.c.mobile)}</td><td class="n">${inr(x.open)}</td><td class="n">${inr(x.cred)}</td><td class="n">${inr(x.pay)}</td><td class="n">${inr(x.ret)}</td><td class="n"><b>${inr(x.bal)}</b></td><td>${x.lp?D(x.lp.date)+' · '+inr(x.lp.amt):'—'}</td><td class="n">${x.dl??'—'}</td><td>${pill(x.st)}</td></tr>`).join('')}</table>`}
function saveC(){const n=$('#n').value.trim(),m=$('#m').value.replace(/\D/g,''),o=+$('#o').value||0;if(!n)return msg='Name required',render();if(m.length!=10)return msg='Enter a 10-digit mobile number',render();if(S.c.some(c=>c.mobile==m))return msg='Mobile already registered',render();
 addC({name:n,mobile:m,village:$('#v').value.trim()||'—',taluka:$('#tk').value,open:o,due:$('#du').value});msg='';persist();render()}
function imp(){$('#imp').value.split('\n').map(l=>l.split(',').map(s=>s.trim())).filter(r=>r[0]&&r[1]).forEach(r=>S.c.some(c=>c.mobile==r[1])||addC({name:r[0],mobile:r[1],village:r[2]||'—',open:+r[3]||0}));persist();render()}
function saveT(){const a=+$('#ta').value,t=$('#tt').value;if(!(a>0))return msg='Enter a valid amount',render();addT(cur,t,$('#td').value||today(),a,{inv:$('#ti').value,desc:$('#tn').value,mode:t=='cash'?'Cash':t=='upi'?'UPI':'',notes:['cash','upi'].includes(t)?'Not counted in credit outstanding':''});msg='';persist();render()}
function rev(id){const t=S.t.find(x=>x.id==id);if(!t||t.rev)return;const r=addT(t.cid,'reversal',today(),t.amt,{desc:'Reversal of '+id,notes:'Correction entry'});t.rev=r;log(id+' reversed by '+r);persist();render()}
function savePay(){const a=+$('#pa').value,x=calc(S.c.find(c=>c.id==cur));if(!(a>0))return msg='Enter a valid amount',render();if(a>Math.max(0,x.bal)&&!$('#adv').checked)return msg=`Amount exceeds outstanding ${inr(x.bal)}. Tick "record excess as advance" to continue.`,render();
 const mode=$('#pm').value,id=addT(cur,'payment',today(),a,{mode,ref:$('#pr').value,notes:$('#pn').value,desc:'Payment collection'});const t=S.t.find(z=>z.id==id);msg='';rcpt={id,date:t.date,time:t.time,n:x.c.name,cid:cur,amt:a,mode,ref:t.ref,bal:x.bal-a};persist();render()}
function fu(id,k,v){S.f[id]={...(S.f[id]||{}),[k]:v};if(k=='status')S.f[id].last=today();log(`Follow-up ${id}: ${k}`);persist();render()}
async function save(name,data){try{const d=await claude.use('downloads');if(d)return d.save({filename:name,data})}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click()}
function backup(){save('nva-backup-'+today()+'.json',JSON.stringify(S))}
function csv(k,id){let rows;if(k=='ledger'){rows=[['Date','ID','Type','Invoice','Mode','Description','Amount']].concat(S.t.filter(t=>t.cid==id).map(t=>[D(t.date),t.id,LBL[t.type],t.inv,t.mode,t.desc,t.amt]))}
 else{const A=k=='register'?all():[...document.querySelectorAll('tr.cl')].map(r=>calc(S.c.find(c=>c.id==r.cells[0].textContent)));rows=[['ID','Name','Village','Mobile','Opening','Credit','Paid','Returns','Outstanding','Days since payment','Status']].concat(A.map(x=>[x.c.id,x.c.name,x.c.village,x.c.mobile,x.open,x.cred,x.pay,x.ret,x.bal,x.dl??'',x.st]))}
 save((k=='ledger'?'statement-'+id:'outstanding-'+k)+'-'+today()+'.csv',rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'))}
function load(d){if(d&&d.c){if(d.demo){d={c:[],t:[],f:{},log:[],n:{c:0,t:0},demo:false};S=d;persist();render();return true}S=d;last=JSON.stringify(S);render();return true}}
(async()=>{render();let L=null;try{const l=localStorage.getItem('nva');if(l)L=JSON.parse(l)}catch(e){}
 try{db=await claude.use('db')}catch(e){}
 if(!db){S=L&&L.c&&!L.demo?L:E();last=JSON.stringify(S);ready=true;setSt('Saved on this device only');render();return}
 ref=db.doc('ledger/main');let first=true;
 ref.onSnapshot(sn=>{const d=sn.exists?sn.data():null;
  if(first){first=false;const uc=d&&d.c&&!d.demo,ul=L&&L.c&&!L.demo;let fromCloud=false;
   if(uc&&(!ul||(d.ts||0)>=(L.ts||0))){S=d;fromCloud=true}else if(ul)S=L;else S=E();
   last=JSON.stringify(S);ready=true;if(!fromCloud)persist();else setSt('Saved ✓ data restored');render();dailyBackup();return}
  if(d&&d.c&&(d.ts||0)>(S.ts||0)){S=d;last=JSON.stringify(S);render();setSt('Updated from another device')}
 },()=>{if(first){first=false;S=L&&L.c&&!L.demo?L:E();ready=true;setSt('⚠ Cloud unavailable – using this device');render()}});
 setTimeout(()=>{if(!ready){S=L&&L.c&&!L.demo?L:E();ready=true;setSt('⚠ Cloud slow – using this device');render()}},10000)})();
</script></body></html>
